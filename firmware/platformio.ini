; Firmware for the Matrix Portal S3 ticker.
;
;   Real app:    pio run -e ticker -t upload
;   Panel test:  pio run -e paneltest -t upload
;   Logs:        pio device monitor
;
; Both use the board's default partition table (tinyuf2-partitions-8MB.csv),
; which has two 2 MB OTA app slots and an FFat data partition.

[platformio]
default_envs = ticker

[env]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit Protomatter@1.7.1
  adafruit/Adafruit GFX Library
  adafruit/Adafruit NeoPixel@1.15.5

[env:ticker]
build_src_filter = +<*> -<paneltest/>
lib_deps =
  ${env.lib_deps}
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.4.3

[env:paneltest]
build_src_filter = +<paneltest/>
